<!-- Job Form — reusable for both Create and Edit modes -->
<div class="px-6 py-5">
  <form [formGroup]="jobForm" (ngSubmit)="onSubmit()" class="space-y-5" id="job-application-form">

    <!-- Status / Context Banner -->
    @if (mode() === 'create' && columnName()) {
      <div class="flex items-center gap-2 px-3 py-2 bg-orange-50 border border-orange-100 rounded-xl">
        <svg class="w-4 h-4 text-orange-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
        </svg>
        <p class="text-xs text-orange-700 font-medium">
          Adding to: <span class="font-bold">{{ columnName() }}</span>
        </p>
      </div>
    }

    <!-- Row 1: Company + Role -->
    <div class="grid grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label for="job-company" class="block text-xs font-semibold text-slate-600">
          Company Name <span class="text-orange-500">*</span>
        </label>
        <input
          id="job-company"
          formControlName="company_name"
          type="text"
          placeholder="Google, Amazon..."
          class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-800 placeholder:text-slate-400 transition-all"
        />
      </div>
      <div class="space-y-1.5">
        <label for="job-role" class="block text-xs font-semibold text-slate-600">
          Role / Position <span class="text-orange-500">*</span>
        </label>
        <input
          id="job-role"
          formControlName="role"
          type="text"
          placeholder="Senior Angular Developer"
          class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-800 placeholder:text-slate-400 transition-all"
        />
      </div>
    </div>

    <!-- Row 2: Job Type + Work Mode -->
    <div class="grid grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label for="job-type" class="block text-xs font-semibold text-slate-600">Job Type</label>
        <select
          id="job-type"
          formControlName="job_type"
          class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-700 transition-all appearance-none"
        >
          @for (type of jobTypeLabels | keyvalue; track type) {
            <option [value]="type.key">{{ type.value }}</option>
          }
        </select>
      </div>
      <div class="space-y-1.5">
        <label for="job-work-mode" class="block text-xs font-semibold text-slate-600">Work Mode</label>
        <select
          id="job-work-mode"
          formControlName="work_mode"
          class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-700 transition-all appearance-none"
        >
          @for (mode of workModeLabels | keyvalue; track mode) {
            <option [value]="mode.key">{{ mode.value }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Row 3: Location + Source -->
    <div class="grid grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label for="job-location" class="block text-xs font-semibold text-slate-600">Location</label>
        <input
          id="job-location"
          formControlName="location"
          type="text"
          placeholder="Bangalore, Remote..."
          class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-800 placeholder:text-slate-400 transition-all"
        />
      </div>
      <div class="space-y-1.5">
        <label for="job-source" class="block text-xs font-semibold text-slate-600">Application Source</label>
        <select
          id="job-source"
          formControlName="source"
          class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-700 transition-all appearance-none"
        >
          @for (src of sourceLabels | keyvalue; track src) {
            <option [value]="src.key">{{ src.value }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Row 4: Salary + Currency -->
    <div class="grid grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label for="job-salary" class="block text-xs font-semibold text-slate-600">Expected Salary</label>
        <input
          id="job-salary"
          formControlName="expected_salary"
          type="number"
          placeholder="e.g. 1200000"
          class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-800 placeholder:text-slate-400 transition-all"
        />
      </div>

    </div>

    <!-- Row 5: Priority (radio group) -->
    <!-- <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-600">Priority</label>
      <div class="flex gap-2">

              ? (p === 'low'    ? 'bg-emerald-50 border-emerald-300 text-emerald-700'
               : p === 'medium' ? 'bg-amber-50 border-amber-300 text-amber-700'
               :                  'bg-rose-50 border-rose-300 text-rose-700')
              : 'bg-slate-50 border-slate-200 text-slate-500 hover:border-slate-300'"
          >
            <input type="radio" formControlName="priority" [value]="p" class="hidden" />

              [class]="p === 'low' ? 'bg-emerald-400' : p === 'medium' ? 'bg-amber-400' : 'bg-rose-400'">
            </span>
            {{ p | titlecase }}
          </label>
        }
      </div>
    </div> -->

    <!-- Row 6: Applied Date + Deadline -->
    <div class="grid grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label for="job-applied-date" class="block text-xs font-semibold text-slate-600">Applied Date</label>
        <input
          id="job-applied-date"
          formControlName="applied_date"
          type="date"
          class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-700 transition-all"
        />
      </div>
      <div class="space-y-1.5">
        <label for="job-deadline" class="block text-xs font-semibold text-slate-600">Deadline</label>
        <input
          id="job-deadline"
          formControlName="deadline"
          type="date"
          class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-700 transition-all"
        />
      </div>
    </div>

    <!-- Row 7: Job URL -->
    <div class="space-y-1.5">
      <label for="job-url" class="block text-xs font-semibold text-slate-600">Job URL</label>
      <input
        id="job-url"
        formControlName="job_url"
        type="url"
        placeholder="https://careers.company.com/..."
        class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-800 placeholder:text-slate-400 transition-all"
      />
    </div>

    <!-- Row 8: Notes -->
    <div class="space-y-1.5">
      <label for="job-notes" class="block text-xs font-semibold text-slate-600">Notes</label>
      <textarea
        id="job-notes"
        formControlName="notes"
        rows="3"
        placeholder="Recruiter contact, next steps, referral details..."
        class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-800 placeholder:text-slate-400 transition-all resize-none"
      ></textarea>
    </div>

    <!-- Actions -->
    <div class="pt-1" [class.flex]="mode() === 'edit'" [class.gap-3]="mode() === 'edit'">

      <!-- Cancel button — only in edit mode -->
      @if (mode() === 'edit') {
        <button
          type="button"
          (click)="onCancel()"
          class="flex-1 py-3 text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors"
          id="btn-cancel-job-form"
        >
          Cancel
        </button>
      }

      <button
        type="submit"
        [disabled]="jobForm.invalid || isSaving()"
        class="flex-1 py-3 bg-orange-500 hover:bg-orange-600 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-bold rounded-xl transition-all duration-150 active:scale-[0.98] shadow-sm shadow-orange-200 flex items-center justify-center gap-2"
        id="btn-submit-job"
      >
        @if (isSaving()) {
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          Saving…
        } @else if (mode() === 'edit') {
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          Save Changes
        } @else {
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          Add Job Application
        }
      </button>

    </div>

  </form>
</div>
