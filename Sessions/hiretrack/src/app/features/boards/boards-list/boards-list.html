  </div>

  <!-- Boards Grid -->
  @if (boardsList().length > 0) {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      @for (board of boardsList(); track board.id) {
        <button
          (click)="navigateToBoard(board.id)"
          class="group bg-white rounded-2xl border border-slate-100 shadow-sm hover:border-orange-500 transition-all duration-200 text-left overflow-hidden cursor-pointer active:scale-[0.98]"
          [id]="'board-card-' + board.id"
        >
          <!-- Color Strip -->
          <div
            class="h-1.5 w-full"
          
          ></div>

          <div class="p-5">
            <!-- Icon + Name -->
            <div class="flex items-start gap-3 mb-3">

              <div class="min-w-0">
                <h3 class="font-bold text-slate-800 text-sm leading-tight truncate group-hover:text-orange-500 transition-colors">
                  {{ board.name }}
                </h3>
                <p class="text-xs text-slate-400 mt-0.5 line-clamp-2">
                  {{ board.description || 'No description' }}
                </p>
              </div>
            </div>

            <!-- Footer -->
            <div class="flex items-center justify-between pt-3 border-t border-slate-50">
              <span class="text-[10px] text-slate-400 font-medium">
                {{ board.created_at | relativeDate }}
              </span>
              <!-- <span class="flex items-center gap-1 text-[10px] text-orange-500 font-semibold group-hover:gap-2 transition-all">
                Open
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
              </span> -->
            </div>
          </div>
        </button>
      }
    </div>
  } @else {
    <!-- Empty State -->
    <div class="flex flex-col items-center justify-center py-24 text-center">
      <div class="w-16 h-16 rounded-2xl bg-orange-50 flex items-center justify-center mb-4">
        <svg class="w-8 h-8 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
        </svg>
      </div>
      <h3 class="text-lg font-bold text-slate-700 mb-1">No boards yet</h3>
      <p class="text-sm text-slate-400 max-w-xs">
        Create your first board to start tracking job applications on a Kanban board.
      </p>
    </div>
  }

</div>
