<!-- Sign Up Page -->
<div class="min-h-screen bg-gradient-to-br from-slate-50 to-orange-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 overflow-hidden">

      <!-- Header Strip -->
      <div class="bg-gradient-to-r from-orange-500 to-orange-400 px-8 py-7">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-9 h-9 bg-white/20 rounded-xl flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </div>
          <span class="text-xl font-bold text-white tracking-tight">HireTrack</span>
        </div>
        <h1 class="text-2xl font-bold text-white">Create your account</h1>
        <p class="text-orange-100 text-sm mt-1">Start tracking your job applications today</p>
      </div>

      <!-- Form Body -->
      <div class="px-8 py-7">
        <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-5" id="signup-form">

          <!-- Email -->
          <div class="space-y-1.5">
            <label for="signup-email" class="block text-sm font-semibold text-slate-700">Email address</label>
            <div class="relative">
              <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              <input
                id="signup-email"
                type="email"
                formControlName="email"
                placeholder="you@example.com"
                class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-800 placeholder:text-slate-400 transition-all"
              />
            </div>
          </div>

          <!-- Password -->
          <div class="space-y-1.5">
            <label for="signup-password" class="block text-sm font-semibold text-slate-700">Password</label>
            <div class="relative">
              <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
              <input
                id="signup-password"
                type="password"
                formControlName="password"
                placeholder="Min 6 characters"
                class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-slate-800 placeholder:text-slate-400 transition-all"
              />
            </div>
            <p class="text-[11px] text-slate-400">Use at least 6 characters with a mix of letters and numbers.</p>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            [disabled]="signupForm.invalid"
            class="w-full py-3 bg-orange-500 hover:bg-orange-600 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-bold rounded-xl transition-all duration-150 active:scale-[0.98] shadow-md shadow-orange-200 mt-2"
            id="btn-signup-submit"
          >
            Create Account
          </button>

        </form>

        <!-- Sign In Link -->
        <p class="text-center text-sm text-slate-500 mt-6">
          Already have an account?
          <a routerLink="/auth/signin" class="text-orange-500 font-semibold hover:text-orange-600 transition-colors" id="link-go-signin">
            Sign in
          </a>
        </p>
      </div>

    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-400 mt-6">
      © 2025 HireTrack · Built for job seekers
    </p>
  </div>
</div>
