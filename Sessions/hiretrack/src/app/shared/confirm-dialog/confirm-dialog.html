<!-- Confirm Dialog Overlay -->
<div
  class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm"
  (click)="cancelled.emit()"
  id="confirm-dialog-backdrop"
>
  <div
    class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden"
    (click)="$event.stopPropagation()"
    id="confirm-dialog"
    style="animation: confirmDialogIn 0.18s cubic-bezier(0.34,1.56,0.64,1) both;"
  >
    <!-- Icon + Header -->
    <div class="px-6 pt-6 pb-4 text-center">
      <div class="w-12 h-12 rounded-full bg-rose-50 flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </div>
      <h3 class="text-base font-bold text-slate-800">{{ title() }}</h3>
      <p class="text-sm text-slate-500 mt-1.5">{{ message() }}</p>
    </div>

    <!-- Actions -->
    <div class="flex gap-2 px-6 pb-6">
      <button
        (click)="cancelled.emit()"
        class="flex-1 py-2.5 text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors"
        id="confirm-dialog-cancel"
      >
        Cancel
      </button>
      <button
        (click)="confirmed.emit()"
        class="flex-1 py-2.5 text-sm font-bold text-white bg-rose-500 hover:bg-rose-600 rounded-xl transition-colors active:scale-95"
        id="confirm-dialog-confirm"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>

<style>
@keyframes confirmDialogIn {
  from { opacity: 0; transform: scale(0.88); }
  to   { opacity: 1; transform: scale(1); }
}
</style>
